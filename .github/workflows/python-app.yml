name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install locked development environment
        run: uv sync --locked --no-editable --python 3.11 --extra dev
      - name: Verify lockfile
        run: uv lock --check
      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: .venv/bin/pytest -q -p no:cacheprovider
      - name: Build release artifacts
        run: uv build --out-dir /tmp/qlab-mcp-build
