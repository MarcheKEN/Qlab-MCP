name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install locked development environment
        run: uv sync --locked --no-editable --python 3.11 --extra dev
      - name: Verify lockfile
        run: uv lock --check
      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: .venv/bin/pytest -q -p no:cacheprovider
      - name: Build release artifacts
        run: uv build --out-dir /tmp/qlab-mcp-build

  audio-tests:
    name: audio tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install locked audio development environment
        run: uv sync --locked --no-editable --python 3.11 --extra dev --extra audio
      - name: Verify FFmpeg and ffprobe
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Run audio analysis tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: .venv/bin/pytest -q -p no:cacheprovider tests/test_audio_analysis.py
