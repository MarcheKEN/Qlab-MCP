[project]
name = "qlab-mcp"
version = "0.4.0"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
description = "FastMCP server for QLab 5 inspection and gated cue and workspace-settings writes over OSC."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.3,<4",
    "pydantic>=2.11",
]

[project.optional-dependencies]
audio = [
    "numpy>=1.26,<3",
    "librosa>=0.11,<0.12",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
qlab-mcp = "qlab_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/qlab_mcp"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["src/qlab_mcp", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
